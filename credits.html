<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <title>RUN1 // Enrichment Center Credits</title>
    <link rel="icon" href="./assets/samurai-logo.webp" />
    <link rel="stylesheet" href="./styles/credits.css" />
    <script src="./scripts/credits.js"></script>
  </head>

  <body>
    <div id="crt">
      <div id="text" aria-live="polite"></div>

      <div id="side">
        <img id="logo" src="./assets/samurai-logo.webp" alt="Samurai logo" />

        <div id="system">
          <div class="system-title">SYSTEM STATUS // RUN1</div>
          <div class="system-row">
            <span>OPERATING SYSTEM</span>
            <span>NixOS</span>
          </div>
          <div class="system-row">
            <span>ENVIRONMENT</span>
            <span>Linux / Wayland</span>
          </div>
          <div class="system-row">
            <span>DEVELOPMENT</span>
            <span>ONLINE</span>
          </div>
          <div class="system-row">
            <span>NEURAL INTERFACE</span>
            <span>OLLAMA</span>
          </div>
          <div class="system-row">
            <span>HUMAN RESOURCES</span>
            <span>1 / 1</span>
          </div>
        </div>
      </div>

      <div id="start" role="button" tabindex="0" aria-label="Start credits">
        <b>THE ARCHITECTS POEM</b>
        <span>[ CLICK OR PRESS ENTER TO BEGIN ]</span>
        <span class="sub">RUN1 ENRICHMENT CENTER // NIGHT CITY DIVISION</span>
      </div>

      <div id="footer">
        PROPERTY OF RUN1-CS // UNAUTHORIZED ACCESS IS ENCOURAGED
      </div>

      <button id="replay" type="button">↻ REPLAY</button>
    </div>
  </body>
</html>
